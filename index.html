<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Đăng Ký Tài Khoản</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <!-- Header Text -->
              <div class="text-center mb-4">
                <h2 class="fw-bold">Tạo Tài Khoản</h2>
                <p class="text-muted">
                  Vui lòng điền đầy đủ các thông tin bên dưới để tiếp tục.
                </p>
              </div>

              <form action="#" method="POST">
                <!-- Họ và tên -->
                <div class="mb-3">
                  <label for="fullName" class="form-label fw-semibold"
                    >Họ và tên</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="fullName"
                    placeholder="Ví dụ: Nguyễn Văn A"
                    required
                  />
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label for="userEmail" class="form-label fw-semibold"
                    >Địa chỉ Email</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="userEmail"
                    placeholder="name@example.com"
                    required
                  />
                  <div class="form-text text-muted">
                    Chúng tôi cam kết không chia sẻ email của bạn với bất kỳ ai.
                  </div>
                </div>

                <!-- Mật khẩu -->
                <div class="mb-3">
                  <label for="userPassword" class="form-label fw-semibold"
                    >Mật khẩu</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="userPassword"
                    placeholder="Nhập ít nhất 6 ký tự"
                    required
                  />
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label fw-semibold"
                    >Xác nhận mật khẩu</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    placeholder="Nhập lại mật khẩu"
                    required
                  />
                </div>

                <!-- Giới tính (Radio) -->
                <div class="mb-3">
                  <label class="form-label fw-semibold d-block"
                    >Giới tính</label
                  >
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="gender"
                      id="genderMale"
                      value="male"
                      checked
                    />
                    <label class="form-check-label" for="genderMale">Nam</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="gender"
                      id="genderFemale"
                      value="female"
                    />
                    <label class="form-check-label" for="genderFemale"
                      >Nữ</label
                    >
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="gender"
                      id="genderOther"
                      value="other"
                    />
                    <label class="form-check-label" for="genderOther"
                      >Khác</label
                    >
                  </div>
                </div>

                <!-- Sở thích (Checkbox) -->
                <div class="mb-3">
                  <label class="form-label fw-semibold d-block">Sở thích</label>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="hobbyReading"
                      value="reading"
                    />
                    <label class="form-check-label" for="hobbyReading"
                      >Đọc sách</label
                    >
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="hobbyCoding"
                      value="coding"
                    />
                    <label class="form-check-label" for="hobbyCoding"
                      >Lập trình</label
                    >
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="hobbyTravel"
                      value="travel"
                    />
                    <label class="form-check-label" for="hobbyTravel"
                      >Du lịch</label
                    >
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="hobbyMusic"
                      value="music"
                    />
                    <label class="form-check-label" for="hobbyMusic"
                      >Âm nhạc</label
                    >
                  </div>
                </div>

                <!-- Quốc gia (Dropdown Select) -->
                <div class="mb-4">
                  <label for="countrySelect" class="form-label fw-semibold"
                    >Quốc gia</label
                  >
                  <select class="form-select" id="countrySelect" required>
                    <option value="" selected disabled>
                      -- Chọn quốc gia --
                    </option>
                    <option value="VN">Việt Nam</option>
                    <option value="US">Hoa Kỳ</option>
                    <option value="JP">Nhật Bản</option>
                    <option value="KR">Hàn Quốc</option>
                    <option value="SG">Singapore</option>
                  </select>
                </div>

                <!-- Nút Submit -->
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">
                    Đăng Ký Tài Khoản
                  </button>
                </div>

                <!-- Footer Link -->
                <p class="text-center text-muted mt-3 mb-0">
                  Đã có tài khoản?
                  <a href="#" class="text-decoration-none">Đăng nhập ngay</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
